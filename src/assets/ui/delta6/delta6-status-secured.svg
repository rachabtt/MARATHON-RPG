    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"IBM Plex Mono","SFMono-Regular","Consolas","Liberation Mono",monospace}.label{font-size:26px;letter-spacing:4px;fill:#7C8A82}.small{font-size:22px;letter-spacing:3px;fill:#90A19A}.micro{font-size:18px;letter-spacing:3px;fill:#62716A}</style>
