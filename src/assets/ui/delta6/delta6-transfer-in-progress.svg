<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DATA PACKAGE DELTA-6 - TRANSFER IN PROGRESS</title>
  <desc id="desc">Transparent 16:9 UESC transfer interface with active uplink indicators and 64 percent transfer progress.</desc>
  <defs>
    <pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H1V1H0V0Z" fill="#8AFFC1" fill-opacity="0.13"/></pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"IBM Plex Mono","SFMono-Regular","Consolas","Liberation Mono",monospace}.label{font-size:26px;letter-spacing:4px;fill:#7C8A82}.small{font-size:22px;letter-spacing:3px;fill:#85938C}.micro{font-size:18px;letter-spacing:3px;fill:#59665F}.green{fill:#59F0A2}.amber{fill:#F0A34A}.line{stroke:#59F0A2}</style>
  </defs>
  <g id="frame" class="mono">
    <path d="M220 160H1540L1700 320V872H380L220 712V160Z" fill="#050706" fill-opacity="0.68" stroke="#59F0A2" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M260 200H1518L1660 342V832H402L260 690V200Z" stroke="#59F0A2" stroke-opacity="0.42" stroke-width="1.5"/>
    <path d="M220 160H430M1490 160H1540L1700 320V382M1700 650V872H1488M432 872H380L220 712V650" stroke="#59F0A2" stroke-width="5"/>
    <rect x="260" y="200" width="1400" height="632" fill="url(#scanlines)" opacity="0.34"/>
  </g>
  <g id="header" class="mono">
    <text x="314" y="276" font-size="52" letter-spacing="6" fill="#E7F9EF">DATA PACKAGE DELTA-6</text>
    <text x="318" y="320" class="label">UESC // DATA RECOVERY // ARCHIVE NODE</text>
    <text x="1304" y="274" class="small" text-anchor="end">TAU CETI IV</text>
    <text x="1304" y="310" class="micro" text-anchor="end">RECOVERY CHANNEL 04-A</text>
  </g>
  <g id="status_block" class="mono">
    <path d="M314 374H1032L1090 432V534H314V374Z" fill="#091410" fill-opacity="0.76" stroke="#59F0A2" stroke-opacity="0.68" stroke-width="2"/>
    <text x="350" y="430" class="label">UPLINK STATE</text>
    <text x="350" y="494" font-size="44" letter-spacing="5" fill="#59F0A2">TRANSFER: IN PROGRESS</text>
  </g>
  <g id="integrity_bar" class="mono">
    <text x="314" y="612" class="label">TRANSFER BUFFER</text>
    <rect x="314" y="640" width="860" height="34" fill="#101411" stroke="#52635B" stroke-width="2"/>
    <rect x="322" y="648" width="550" height="18" fill="#59F0A2"/>
    <rect x="884" y="648" width="88" height="18" fill="#F0A34A" fill-opacity="0.8"/>
    <path d="M532 640V674M748 640V674M964 640V674" stroke="#233128" stroke-width="2"/>
    <text x="1204" y="670" font-size="34" letter-spacing="4" fill="#59F0A2">64%</text>
  </g>
  <g id="waveform" class="mono">
    <text x="1122" y="414" class="label">SIGNAL TRACE</text>
    <path d="M1122 468H1548" stroke="#52635B" stroke-width="2"/>
    <polyline points="1122,490 1158,454 1194,502 1230,446 1266,506 1302,444 1338,506 1374,450 1410,498 1446,458 1482,490 1548,462" stroke="#59F0A2" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)"/>
    <rect x="1122" y="522" width="92" height="16" fill="#59F0A2" fill-opacity="0.75"/>
    <rect x="1230" y="522" width="76" height="16" fill="#59F0A2" fill-opacity="0.48"/>
    <rect x="1322" y="522" width="132" height="16" fill="#F0A34A" fill-opacity="0.55"/>
    <rect x="1472" y="522" width="76" height="16" fill="#59F0A2" fill-opacity="0.6"/>
  </g>
  <g id="metadata" class="mono">
    <path d="M314 728H1548" stroke="#52635B" stroke-opacity="0.7"/>
    <text x="314" y="774" class="small">CHECKSUM: STREAMING</text>
    <text x="314" y="816" class="small">UPLINK: ACTIVE</text>
    <text x="734" y="774" class="small">BUFFER: 64 / 100</text>
    <text x="734" y="816" class="small">PACKETS: REORDERING</text>
    <text x="1184" y="774" class="small">ARCHIVE NODE: D6-FIELD</text>
    <text x="1184" y="816" class="small">RECOVERY: CONTINUE</text>
  </g>
</svg>
