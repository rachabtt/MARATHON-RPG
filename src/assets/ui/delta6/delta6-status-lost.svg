<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DATA PACKAGE DELTA-6 - STATUS LOST</title>
  <desc id="desc">Transparent 16:9 UESC data recovery interface with failed recovery state and 5 percent integrity.</desc>
  <defs>
