    <style>.mono{font-family:"IBM Plex Mono","SFMono-Regular","Consolas","Liberation Mono",monospace}.label{font-size:26px;letter-spacing:4px;fill:#6F7672}.small{font-size:22px;letter-spacing:3px;fill:#747B77}.micro{font-size:18px;letter-spacing:3px;fill:#505753}</style>
  </defs>
  <g id="frame" class="mono">
