<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DATA PACKAGE DELTA-6 - STATUS NON SÉCURISÉ</title>
  <desc id="desc">Transparent 16:9 UESC data recovery interface panel with moderate instability and 42 percent package integrity.</desc>
  <defs>
    <pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H1V1H0V0Z" fill="#8AFFC1" fill-opacity="0.12"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:"IBM Plex Mono","SFMono-Regular","Consolas","Liberation Mono",monospace}
      .label{font-size:26px;letter-spacing:4px;fill:#7C8A82}
      .small{font-size:22px;letter-spacing:3px;fill:#85938C}
      .micro{font-size:18px;letter-spacing:3px;fill:#59665F}
      .green{fill:#59F0A2}.amber{fill:#F0A34A}.line{stroke:#59F0A2}.dim{stroke:#52635B}
    </style>
  </defs>
  <g id="frame" class="mono">
    <path d="M250 178H1515L1670 333V858H405L250 703V178Z" fill="#050706" fill-opacity="0.70" stroke="#59F0A2" stroke-opacity="0.58" stroke-width="2"/>
    <path d="M286 214H1494L1634 354V822H426L286 682V214Z" stroke="#F0A34A" stroke-opacity="0.34" stroke-width="1.5"/>
    <path d="M250 178H436M1484 178H1515L1670 333V377M1670 672V858H1484M436 858H405L250 703V672" stroke="#59F0A2" stroke-width="5" stroke-linecap="square"/>
    <rect x="286" y="214" width="1348" height="608" fill="url(#scanlines)" opacity="0.32"/>
  </g>
  <g id="header" class="mono">
    <text x="330" y="288" font-size="52" letter-spacing="6" fill="#E7F9EF">DATA PACKAGE DELTA-6</text>
    <text x="334" y="332" class="label">UESC // DATA RECOVERY // ARCHIVE NODE</text>
    <text x="1280" y="286" class="small" text-anchor="end">TAU CETI IV</text>
    <text x="1280" y="322" class="micro" text-anchor="end">RECOVERY CHANNEL 04-A</text>
  </g>
  <g id="status_block" class="mono">
    <path d="M330 382H982L1040 440V532H330V382Z" fill="#0B1210" fill-opacity="0.74" stroke="#F0A34A" stroke-opacity="0.62" stroke-width="2"/>
    <text x="366" y="438" class="label">CURRENT STATE</text>
    <text x="366" y="500" font-size="44" letter-spacing="5" fill="#F0A34A">STATUS: NON SÉCURISÉ</text>
  </g>
  <g id="integrity_bar" class="mono">
    <text x="330" y="614" class="label">PACKAGE INTEGRITY</text>
    <rect x="330" y="642" width="810" height="34" fill="#101411" stroke="#52635B" stroke-width="2"/>
    <rect x="338" y="650" width="338" height="18" fill="#F0A34A"/>
    <path d="M716 642V676M898 642V676M1080 642V676" stroke="#233128" stroke-width="2"/>
    <text x="1168" y="672" font-size="34" letter-spacing="4" fill="#F0A34A">42%</text>
  </g>
  <g id="waveform" class="mono">
    <text x="1110" y="420" class="label">SIGNAL TRACE</text>
    <path d="M1110 472H1534" stroke="#52635B" stroke-width="2"/>
    <polyline points="1110,482 1150,464 1190,492 1230,452 1270,488 1310,468 1350,474 1390,448 1430,500 1470,458 1510,472 1534,466" stroke="#59F0A2" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)"/>
    <rect x="1110" y="522" width="70" height="16" fill="#59F0A2" fill-opacity="0.68"/>
    <rect x="1196" y="522" width="118" height="16" fill="#F0A34A" fill-opacity="0.58"/>
    <rect x="1330" y="522" width="38" height="16" fill="#59F0A2" fill-opacity="0.48"/>
    <rect x="1390" y="522" width="144" height="16" fill="#59F0A2" fill-opacity="0.32"/>
  </g>
  <g id="metadata" class="mono">
    <path d="M330 728H1534" stroke="#52635B" stroke-opacity="0.7"/>
    <text x="330" y="774" class="small">CHECKSUM: PENDING</text>
    <text x="330" y="816" class="small">BUFFER: OPEN</text>
    <text x="730" y="774" class="small">ARCHIVE NODE: D6-FIELD</text>
    <text x="730" y="816" class="small">SIGNAL: DEGRADED</text>
    <text x="1190" y="774" class="small">CRC WINDOW: 04</text>
    <text x="1190" y="816" class="small">RECOVERY: MANUAL REVIEW</text>
  </g>
</svg>
